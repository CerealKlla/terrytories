license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory

description='''
Kingdoms (large geographic regions containing multiple settlements under one
banner) and per-player Reputation (per-settlement and per-kingdom), driving
NPC hostility/friendliness, price bonuses, quest gating, and kingdom-settlement
standing.
'''

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Nuclyus is the suite's foundation mod -- required for every mod.
[[dependencies.${mod_id}]]
    modId="nuclyus"
    type="required"
    reason="Foundation mod for shared base classes/contracts."
    ordering="AFTER"
    side="BOTH"

# Cartographyr -- Kingdoms are registered as a new, large Geometry.Polygon layer.
[[dependencies.${mod_id}]]
    modId="cartographyr"
    type="required"
    reason="Kingdoms are registered as a new, large Geometry.Polygon layer."
    ordering="AFTER"
    side="BOTH"

# Settlemynts -- resolves settlements/plots/NPCs reputation is tracked against.
[[dependencies.${mod_id}]]
    modId="settlemynts"
    type="required"
    reason="Resolves the settlements/plots/NPCs reputation is tracked against."
    ordering="AFTER"
    side="BOTH"

# Myssions -- quests completed for a settlement grant its reputation.
[[dependencies.${mod_id}]]
    modId="myssions"
    type="required"
    reason="Quests completed for a settlement grant its reputation."
    ordering="AFTER"
    side="BOTH"

# Yconomics -- Friendly reputation grants a composable buy/sell price bonus.
[[dependencies.${mod_id}]]
    modId="yconomics"
    type="required"
    reason="Friendly reputation grants a composable buy/sell price bonus."
    ordering="AFTER"
    side="BOTH"

# Coryspondance -- the one-time "found your own settlement" letter is sent through its mail API.
[[dependencies.${mod_id}]]
    modId="coryspondance"
    type="required"
    reason="Sends the one-time 'found your own settlement' letter through its mail API."
    ordering="AFTER"
    side="BOTH"

# Lyfe is optional -- town-defense reputation credits every assisting player via its General
# assist-marker system if it happens to be loaded (see bridge.LyfeAssistBridge).
[[dependencies.${mod_id}]]
    modId="lyfe"
    type="optional"
    reason="Credits every assisting player for town-defense reputation via the assist-marker system."
    ordering="NONE"
    side="BOTH"
