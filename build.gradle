plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Wires Minecraft/NeoForge onto the src/test/java classpath so JUnit tests can reference
    // vanilla/NeoForge classes.
    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {

    // Nuclyus is a required foundation dependency (see neoforge.mods.toml) -- hard-imported by
    // every mod in the suite for shared base classes/contracts.
    compileOnly files("../Nuclyus/build/libs/nuclyus-${nuclyus_version}.jar")
    testCompileOnly files("../Nuclyus/build/libs/nuclyus-${nuclyus_version}.jar")
    testRuntimeOnly files("../Nuclyus/build/libs/nuclyus-${nuclyus_version}.jar")

    // Cartographyr is required -- Kingdoms are registered as a new, large Cartographyr Geometry
    // .Polygon layer; reputation is keyed off real settlement/plot geography.
    compileOnly files("../Cartographyr/build/libs/cartographyr-${cartographyr_version}.jar")
    testCompileOnly files("../Cartographyr/build/libs/cartographyr-${cartographyr_version}.jar")
    testRuntimeOnly files("../Cartographyr/build/libs/cartographyr-${cartographyr_version}.jar")

    // Settlemynts is required -- resolves settlements/plots/NPCs reputation is tracked against,
    // and is extended with a small hostile-targeting hook for Guards.
    compileOnly files("../Settlemynts/build/libs/settlemynts-${settlemynts_version}.jar")
    testCompileOnly files("../Settlemynts/build/libs/settlemynts-${settlemynts_version}.jar")
    testRuntimeOnly files("../Settlemynts/build/libs/settlemynts-${settlemynts_version}.jar")

    // Myssions is required -- quests completed for a settlement grant its reputation, via the new
    // global QuestEndHooks hook.
    compileOnly files("../Myssions/build/libs/myssions-${myssions_version}.jar")
    testCompileOnly files("../Myssions/build/libs/myssions-${myssions_version}.jar")
    testRuntimeOnly files("../Myssions/build/libs/myssions-${myssions_version}.jar")

    // Yconomics is required -- Friendly reputation grants a composable buy/sell price bonus through
    // its existing per-player ShopPricing hook point.
    compileOnly files("../Yconomics/build/libs/yconomics-${yconomics_version}.jar")
    testCompileOnly files("../Yconomics/build/libs/yconomics-${yconomics_version}.jar")
    testRuntimeOnly files("../Yconomics/build/libs/yconomics-${yconomics_version}.jar")

    // Coryspondance is required -- the one-time "found your own settlement" letter from a
    // settlement's mayor is sent through its mail API.
    compileOnly files("../Coryspondance/build/libs/coryspondance-${coryspondance_version}.jar")
    testCompileOnly files("../Coryspondance/build/libs/coryspondance-${coryspondance_version}.jar")
    testRuntimeOnly files("../Coryspondance/build/libs/coryspondance-${coryspondance_version}.jar")

    // Lyfe is an OPTIONAL soft dependency (see neoforge.mods.toml) -- town-defense reputation
    // credits every assisting player via Lyfe's General assist-marker system (bridge
    // .LyfeAssistBridge), gated behind ModList.get().isLoaded("lyfe") at runtime.
    compileOnly files("../Lyfe/build/libs/lyfe-${lyfe_version}.jar")
    testCompileOnly files("../Lyfe/build/libs/lyfe-${lyfe_version}.jar")
    testRuntimeOnly files("../Lyfe/build/libs/lyfe-${lyfe_version}.jar")

    // Plain JUnit 5 for pure logic tests (no live server/registry needed, so ModDevGradle's
    // neoForge { unitTest {} } FML-bootstrap machinery isn't required for these).
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
